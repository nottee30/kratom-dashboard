<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard ร้านน้ำกระท่อม</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="loading">

<img src="logo.png" class="loading-logo">

<h2>รอก่อนนะวัยรุ่น...</h2>

</div>

<div id="app" style="display:none;">

<header>

<img src="logo.png" class="main-logo">

<p id="updateTime">รอก่อนนะวัยรุ่น...</p>

</header>

<section class="summary">

<div class="summary-card gold">

<span>💰</span>

<h3>ยอดขายรวม</h3>

<h2 id="sumMoney">0</h2>

</div>

<div class="summary-card silver">

<span>👥</span>

<h3>ลูกค้า</h3>

<h2 id="sumCustomer">0</h2>

</div>

<div class="summary-card bronze">

<span>🥤</span>

<h3>น้ำทั้งหมด</h3>

<h2 id="sumWater">0</h2>

</div>

<div class="summary-card last">

<span>🎁</span>

<h3>ขวดฟรี</h3>

<h2 id="sumFree">0</h2>

</div>

</section>

<section class="search-section">

<input
type="text"
id="search"
placeholder="🔍 ใส่ชื่อตัวเอง">

<div class="divider">

<span>หรือ</span>

</div>

<select id="customerSelect">

<option value="">

👤 เลือกชื่อตัวเอง

</option>

</select>

</section>

<section>

<div id="customerCard">

<div class="welcome">

<h2>

👋 ว่าไงพรรคพวก

</h2>

<p>

แจงยอด ใส่ชื่อตัวเอง

</p>

</div>

</div>

</section>

<section>

<h2 class="title">

🏆 TOP ฟอกไต

</h2>

<div id="leaderboard">

</div>

</section>

<section>

<div id="list">

</div>

</section>

</div>

<audio id="rankSound">

<source src="open.mp3">

</audio>
  
<script src="script.js"></script>

</body>

</html>
