<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard ร้านน้ำกระท่อม</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="loading">

<div class="loader"></div>

<h2>กำลังโหลดข้อมูล...</h2>

</div>

<div id="app" style="display:none;">

<header>

<h1>🥤 Dashboard ร้านน้ำกระท่อม</h1>

<p id="updateTime">
กำลังโหลด...
</p>

</header>

<section class="summary">

<div class="summary-card">

<span>💰</span>

<h3>ยอดขายรวม</h3>

<h2 id="sumMoney">0</h2>

</div>

<div class="summary-card">

<span>👥</span>

<h3>ลูกค้า</h3>

<h2 id="sumCustomer">0</h2>

</div>

<div class="summary-card">

<span>🥤</span>

<h3>น้ำทั้งหมด</h3>

<h2 id="sumWater">0</h2>

</div>

<div class="summary-card">

<span>🎁</span>

<h3>ขวดฟรี</h3>

<h2 id="sumFree">0</h2>

</div>

</section>

<section class="search-section">

<input
type="text"
id="search"
placeholder="🔍 ค้นหาลูกค้า">

<div class="divider">

<span>หรือ</span>

</div>

<select id="customerSelect">

<option value="">

👤 เลือกรายชื่อลูกค้า

</option>

</select>

</section>

<section>

<div id="customerCard">

<div class="welcome">

<h2>

👋 ยินดีต้อนรับ

</h2>

<p>

ค้นหาชื่อลูกค้าเพื่อดูรายละเอียด

</p>

</div>

</div>

</section>

<section>

<h2 class="title">

🏆 TOP ลูกค้า

</h2>

<div id="leaderboard">

</div>

</section>

<section>

<div id="list">

</div>

</section>

</div>

<audio id="rankSound">

<source src="open.mp3">

</audio>
  
<script src="script.js"></script>

</body>

</html>
