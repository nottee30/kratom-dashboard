<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ส่งยอด</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="pay-box">

    <div class="pay-header">

        <h1>💳 ส่งยอด</h1>

        <h2 id="customerName">
            รอเปรี๊ยบ!
        </h2>

        <p>ยอดที่ต้องชำระ</p>

        <h1 id="amount">
            0 บาท
        </h1>

    </div>

    <div class="qr-frame">

        <img src="qr.png" class="qr">

        <h2 class="qr-name">
            นาย ณัฐนันท์ พันธุ์บุรี
        </h2>

    </div>

    <div class="slip-frame">

        <input
        type="file"
        id="slip"
        accept="image/*">

    </div>

    <button
    id="submitBtn"
    onclick="submitPayment()">

        📤 ส่งยอดหัวจ่าย

    </button>

</div>

<script src="pay.js"></script>

</body>
</html>
